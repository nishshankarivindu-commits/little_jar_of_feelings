<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF3F0">
  <title>Little Jar of Feelings</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-gradient-start: #FCF6F5;
      --bg-gradient-mid: #F8EBE8;
      --bg-gradient-end: #F2E3E9;
      --text-main: #3C2E3D;
      --text-muted: #8C7382;
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-body: 'Quicksand', sans-serif;
      --jar-glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.15) 45%, rgba(255, 255, 255, 0.3) 100%);
      --jar-border: rgba(255, 255, 255, 0.9);
      --jar-liquid: linear-gradient(180deg, rgba(255, 215, 225, 0.4) 0%, rgba(248, 172, 195, 0.5) 100%);
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-body);
      background: radial-gradient(circle at 50% 30%, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .magic-ambient {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .magical-sparkle {
      position: absolute;
      background: radial-gradient(circle, rgba(255,225,235,1) 0%, rgba(255,182,193,0) 75%);
      border-radius: 50%;
      opacity: 0;
      animation: SparkleUp 12s infinite linear;
    }
    @keyframes SparkleUp {
      0% { transform: translateY(105vh) scale(0.3); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
    }

    .top-action-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 0;
      z-index: 10;
    }
    .header-badge {
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #9C7E90;
      background: rgba(255, 255, 255, 0.78);
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(150, 100, 120, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sound-badge-btn {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-display);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(150, 100, 120, 0.05);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .sound-badge-btn:hover {
      background: rgba(255, 255, 255, 0.98);
      color: var(--text-main);
      transform: translateY(-1.5px) scale(1.03);
    }

    header {
      text-align: center;
      padding: 6px 16px 0;
      z-index: 10;
      flex-shrink: 0;
    }
    .main-title {
      font-family: var(--font-display);
      font-size: clamp(25px, 6.5vw, 35px);
      font-weight: 700;
      color: #3C1E4A;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .main-title .header-heart {
      color: #FF5A79;
      font-size: 0.85em;
      animation: HeartPulse 2.2s infinite ease-in-out;
    }
    @keyframes HeartPulse {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
      45% { transform: scale(1.12); }
    }
    .main-subtitle {
      font-size: clamp(12.5px, 3.4vw, 14.5px);
      color: var(--text-muted);
      margin-top: 4px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
      font-weight: 600;
    }

    /* CENTRAL STAGE & THE JAR */
    .bottle-stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 65vh;
      max-height: 580px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      flex-grow: 1;
      margin: auto 0;
    }

    .giant-jar-wrapper {
      position: relative;
      width: 270px;
      height: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      filter: drop-shadow(0 20px 32px rgba(120, 80, 100, 0.16));
      z-index: 2;
    }

    .jar-cork {
      width: 80px;
      height: 28px;
      background: linear-gradient(135deg, #DEAA79 0%, #A07248 100%);
      border-radius: 8px 8px 4px 4px;
      border: 1.5px solid #805634;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.18), inset 0 2px 4px rgba(255,255,255,0.4);
      position: relative;
      z-index: 4;
      margin-bottom: -5px;
    }
    .jar-lip {
      width: 106px;
      height: 15px;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.98);
      border-radius: 12px;
      box-shadow: 0 3px 6px rgba(100, 50, 70, 0.08), inset 0 1px 2px #FFF;
      backdrop-filter: blur(4px);
      z-index: 3;
      margin-bottom: -3px;
    }
    .jar-neck {
      width: 80px;
      height: 34px;
      background: linear-gradient(90deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.8) 100%);
      border-left: 2.5px solid rgba(255, 255, 255, 0.92);
      border-right: 2.5px solid rgba(255, 255, 255, 0.92);
      z-index: 2;
      position: relative;
    }
    
    .jar-body {
      width: 270px;
      height: 340px;
      position: relative;
      border-radius: 56px 56px 48px 48px;
      background: var(--jar-glass-bg);
      border: 3.5px solid var(--jar-border);
      box-shadow: 
        inset 0 0 24px rgba(255, 255, 255, 0.85), 
        inset 0 -16px 32px rgba(245, 175, 195, 0.35), 
        0 16px 36px rgba(135, 90, 110, 0.18);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }

    .jar-liquid {
      position: absolute;
      inset: 0.5px;
      bottom: 0.5px;
      height: 85%;
      background: var(--jar-liquid);
      border-radius: 0 0 43px 43px;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }
    .liquid-wave-bg {
      position: absolute;
      top: -12px;
      left: -20%;
      width: 140%;
      height: 25px;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 238, 244, 0.8) 0%, rgba(255, 215, 225, 0) 70%);
      border-radius: 50%;
      animation: NaturalSway 6s infinite ease-in-out alternate;
    }
    @keyframes NaturalSway {
      0% { transform: translateY(0) rotate(-1deg); }
      100% { transform: translateY(4px) rotate(1.5deg); }
    }

    .glass-highlight-strip {
      position: absolute;
      top: 16px;
      left: 12px;
      width: 14px;
      height: 70%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.1) 85%, transparent 100%);
      border-radius: 10px;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 5;
    }

    /* TAG BUTTONS CONTAINER */
    .tags-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      z-index: 6;
      gap: 6px;
    }

    /* TAG STYLING */
    .bottle-embedded-tag {
      width: 90%;
      max-width: 220px;
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      text-decoration: none;
      touch-action: manipulation;
    }
    
    .tag-miss_me {
       border: 2px solid #E0E0E0 !important;
       box-shadow: inset 0 0 0 2px #fff, 0 2px 5px rgba(0,0,0,0.1) !important;
    }

    .bottle-embedded-tag .tag-content {
      display: flex;
      align-items: center;
    }
    .bottle-embedded-tag .tag-icon {
      font-size: 15px;
      margin-right: 8px;
      display: inline-block;
      transition: transform 0.2s ease;
    }
    
    .bottle-embedded-tag .tag-label {
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: #3C2E3D;
    }
    .bottle-embedded-tag .tag-chevron {
      font-size: 15px;
      color: #3C2E3D;
      opacity: 0.8;
      transition: transform 0.2s ease;
      font-weight: bold;
    }

    .bottle-embedded-tag:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      z-index: 10;
    }
    .bottle-embedded-tag:hover .tag-chevron {
      transform: translateX(2px);
    }
    .bottle-embedded-tag:hover .tag-icon {
      transform: scale(1.2) rotate(8deg);
    }
    .bottle-embedded-tag:active {
      transform: scale(0.96);
    }

    .bottle-embedded-tag.tugging {
      animation: BadgeTug 0.3s ease-out forwards;
    }
    @keyframes BadgeTug {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    footer {
      text-align: center;
      padding: 8px 16px 20px;
      z-index: 10;
      flex-shrink: 0;
    }
    .instruction-card {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.78);
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(120, 60, 80, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
    }
    .sparkle-decor {
      color: #FF5A79;
      font-size: 15px;
    }

    /* MODAL OVERLAY */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 25, 38, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .modal-viewport {
      perspective: 1200px;
      width: 100%;
      max-width: 385px;
      position: relative;
    }

    .glow-sparkle-group {
      position: absolute;
      inset: -25px;
      pointer-events: none;
      z-index: 10;
    }
    .glow-spr {
      position: absolute;
      width: 20px;
      height: 20px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      color: #FFD166;
    }
    .modal-overlay.visible .s1 { top: 2%; left: 8%; animation: PopSpr 0.9s ease 0.2s forwards; }
    .modal-overlay.visible .s2 { top: 12%; right: 6%; animation: PopSpr 0.9s ease 0.3s forwards; }
    .modal-overlay.visible .s3 { bottom: 15%; left: 4%; animation: PopSpr 0.9s ease 0.4s forwards; }
    .modal-overlay.visible .s4 { bottom: 8%; right: 8%; animation: PopSpr 0.9s ease 0.5s forwards; }
    @keyframes PopSpr {
      0% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(35deg); }
      100% { opacity: 0; transform: scale(0.6) rotate(70deg); }
    }

    /* Paper Card - Natural Unrolling Animation */
    .modal-card {
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(45, 20, 35, 0.2), 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.95);
      position: relative;
      overflow: hidden;
      
      height: 0;
      opacity: 0;
      transform-origin: top;
      
      display: flex;
      flex-direction: column;
    }
    
    .modal-overlay.visible .modal-card {
      animation: UnrollPaper 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
    }
    
    @keyframes UnrollPaper {
      0% {
        height: 0;
        opacity: 0;
        transform: scaleY(0.05) rotateX(15deg);
      }
      40% {
        opacity: 1;
      }
      100% {
        height: auto;
        max-height: 80vh;
        opacity: 1;
        transform: scaleY(1) rotateX(0deg);
      }
    }

    .modal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        transparent,
        transparent 31px,
        rgba(235, 220, 230, 0.35) 31px,
        rgba(235, 220, 230, 0.35) 32px
      );
      pointer-events: none;
      z-index: 1;
    }
    .red-paper-margin {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 32px;
      width: 1.5px;
      background: rgba(255, 110, 140, 0.35);
      pointer-events: none;
      z-index: 1;
    }

    .card-top {
      padding: 22px 20px 14px 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid rgba(235, 220, 225, 0.5);
      position: relative;
      z-index: 2;
    }
    .category-details-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .circle-avatar-icon {
      font-size: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(100,50,70,0.06);
    }
    .meta-content-wrapper {
      display: flex;
      flex-direction: column;
    }
    .category-title-label {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: #3C1E4A;
      line-height: 1.1;
    }
    .comb-tag-index {
      font-size: 10.5px;
      font-weight: 700;
      color: #8C7383;
      letter-spacing: 0.2px;
      margin-top: 1px;
    }
    .close-btn-corner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.04);
      color: #8C7383;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s;
    }
    .close-btn-corner:hover {
      background: rgba(0, 0, 0, 0.08);
      transform: scale(1.08);
    }

    .card-main-content {
      padding: 20px 24px 20px 48px;
      position: relative;
      z-index: 2;
      overflow-y: auto;
      max-height: 48vh;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    .actual-msg-content {
      font-family: var(--font-display);
      font-size: clamp(16px, 4.4vw, 19.5px);
      line-height: 1.5;
      color: #3C2E3D;
      font-weight: 500;
      text-align: center;
      transition: opacity 0.2s ease, transform 0.2s ease;
      /* Ensuring text is always fully opaque unless explicitly fading */
      opacity: 1;
      transform: translateY(0);
    }
    .actual-msg-content.fading {
      opacity: 0;
      transform: translateY(6px);
    }

    .card-footer {
      padding: 14px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1.5px solid rgba(235, 220, 225, 0.5);
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 0 0 24px 24px;
    }
    .action-btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 16px;
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-abort {
      border: 1.5px solid #E2D0D8;
      background: #FFFFFF;
      color: #72576B;
      box-shadow: 0 3px 6px rgba(0,0,0,0.02);
    }
    .btn-abort:hover {
      background: #FAF3F6;
      border-color: #D1B8C5;
      transform: translateY(-1.5px);
    }
    .btn-shuffle {
      border: none;
      background: linear-gradient(135deg, #FF7B9A 0%, #FF5A79 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(255, 90, 121, 0.32);
    }
    .btn-shuffle:hover {
      box-shadow: 0 8px 22px rgba(255, 90, 121, 0.42);
      transform: translateY(-2px);
    }
    .action-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    @media (max-height: 640px) {
      header { padding: 4px 12px 0; }
      .main-title { font-size: clamp(20px, 5.5vw, 25px); }
      .main-subtitle { font-size: 11.5px; margin-top: 1px; }
      .bottle-stage { height: 60vh; min-height: 320px; }
      .giant-jar-wrapper { width: 240px; height: 360px; }
      .jar-body { width: 240px; height: 295px; border-radius: 46px 46px 36px 36px; padding: 15px 12px; }
      .bottle-embedded-tag { padding: 7px 10px; border-radius: 10px; max-width: 200px;}
      .bottle-embedded-tag .tag-label { font-size: 11.5px; }
      .bottle-embedded-tag .tag-icon { font-size: 13px; }
      .jar-cork { width: 62px; height: 22px; }
      .jar-lip { width: 84px; height: 12px; }
      .jar-neck { width: 62px; height: 26px; }
    }

    @media (max-width: 360px) {
      .giant-jar-wrapper { width: 220px; height: 330px; }
      .jar-body { width: 220px; height: 275px; border-radius: 38px 38px 30px 30px; padding: 12px 10px;}
      .bottle-embedded-tag { padding: 6px 9px; border-radius: 9px; }
      .bottle-embedded-tag .tag-label { font-size: 10.5px; }
      .bottle-embedded-tag .tag-icon { font-size: 12px; margin-right: 5px;}
    }
  </style>
</head>
<body>

  <div class="magic-ambient" aria-hidden="true">
    <div class="magical-sparkle" style="left: 10%; animation-delay: 0s; width: 35px; height: 35px;"></div>
    <div class="magical-sparkle" style="left: 32%; animation-delay: 3s; width: 18px; height: 18px;"></div>
    <div class="magical-sparkle" style="left: 65%; animation-delay: 6s; width: 45px; height: 45px;"></div>
    <div class="magical-sparkle" style="left: 88%; animation-delay: 2.2s; width: 25px; height: 25px;"></div>
    <div class="magical-sparkle" style="left: 50%; animation-delay: 8.4s; width: 40px; height: 40px;"></div>
  </div>

  <div class="top-action-bar">
    <div class="header-badge">
      <span>✦</span>
      <span>A little reminder for your heart</span>
      <span>✦</span>
    </div>
    <button class="sound-badge-btn" id="audioSwitch" aria-label="Toggle Sound Effects">
      <span id="audioGlyph">🔔</span>
      <span id="audioStatus">Sound On</span>
    </button>
  </div>

  <header>
    <h1 class="main-title">
      <span class="header-heart">♡</span>
      Little Jar of Feelings
      <span class="header-heart">♡</span>
    </h1>
    <p class="main-subtitle">Choose the colour that matches your moment. Open a tiny note made just for you.</p>
  </header>

  <main class="bottle-stage">
    <div class="giant-jar-wrapper">
      <div class="jar-cork"></div>
      <div class="jar-lip"></div>
      <div class="jar-neck"></div>
      
      <div class="jar-body" id="jarContainer">
        <div class="glass-highlight-strip"></div>
        <div class="jar-liquid">
          <div class="liquid-wave-bg"></div>
        </div>

        <div class="tags-container" id="bottleTagsOverlay">
          
          <button class="bottle-embedded-tag" data-category="happy" aria-label="When you are happy" style="background-color: #F8C8D8;">
            <div class="tag-content">
              <span class="tag-icon">☀️</span>
              <span class="tag-label">When you are happy...</span>
            </div>
            <span class="tag-chevron">›</span>
          </button>

          <button class="bottle-embedded-tag" data-category="sad" aria-label="When you are sad" style="background-color: #F77F9B;">
            <div class="tag-content">
              <span class="tag-icon">🌧️</span>
              <span class="tag-label">When you are sad...</span>
            </div>
            <span class="tag-chevron">›</span>

    class Synthesizer {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.ambientStarted = false;
        this.ambientTimer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.enabled) {
            this.startAmbient();
        } else {
            this.stopAmbient();
        }
        return this.enabled;
      }

      play(freq, type, start, duration, volume = 0.12) {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, start);
          
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(volume, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(start);
          osc.stop(start + duration);
        } catch (e) {}
      }

      chimeUnroll() {
        this.init();
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const scale = [392.00, 440.00, 523.25, 659.25, 783.99, 1046.50]; 
        scale.forEach((freq, i) => {
            this.play(freq, 'sine', t + (i * 0.05), 0.25, 0.06);
        });
        this.play(1318.51, 'sine', t + (scale.length * 0.05), 0.4, 0.08); 
      }

      chimeTap() {
        this.init();
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        this.play(659.25, 'sine', t, 0.12, 0.15); 
        this.play(987.77, 'sine', t + 0.06, 0.2, 0.11); 
      }

      chimeShuffle() {
        this.init();
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        this.play(880.00, 'sine', t, 0.1, 0.12); 
        this.play(1318.51, 'sine', t + 0.05, 0.22, 0.1); 
      }

      chimeClose() {
        this.init();
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        this.play(587.33, 'sine', t, 0.14, 0.08); 
        this.play(392.00, 'sine', t + 0.06, 0.22, 0.07); 
      }

      playAmbientNote() {
        if (!this.enabled || !this.ctx) return;
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; 
        const freq = notes[Math.floor(Math.random() * notes.length)];
        
        const t = this.ctx.currentTime;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.012, t + 2.0); 
            gain.gain.linearRampToValueAtTime(0, t + 6.0);
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            osc.start(t);
            osc.stop(t + 6.0);
        } catch(e) {}
        
        this.ambientTimer = setTimeout(() => this.playAmbientNote(), 1500 + Math.random() * 2000);
      }

      startAmbient() {
        this.init();
        if (this.ambientStarted || !this.enabled) return;
        this.ambientStarted = true;
        this.playAmbientNote();
      }

      stopAmbient() {
        if (this.ambientTimer) {
            clearTimeout(this.ambientTimer);
        }
        this.ambientStarted = false;
      }
    }

    const synth = new Synthesizer();

    const dom = {
      audioSwitch: document.getElementById('audioSwitch'),
      audioGlyph: document.getElementById('audioGlyph'),
      audioStatus: document.getElementById('audioStatus'),
      overlayCard: document.getElementById('overlayCard'),
      paperView: document.getElementById('paperView'),
      circleIcon: document.getElementById('circleIcon'),
      headerCategory: document.getElementById('headerCategory'),
      combIndex: document.getElementById('combIndex'),
      modalText: document.getElementById('modalText'),
      btnAbort: document.getElementById('btnAbort'),
      btnShuffle: document.getElementById('btnShuffle'),
      btnCloseTop: document.getElementById('btnCloseTop')
    };

    let targetKey = null;
    let indexArray = null;
    let shuffleTimer = null; // IMPORTANT: Timer variable to prevent the bug

    function createCombination(categoryKey) {
      const cat = CATEGORIES_DATA[categoryKey];
      if (!cat) return [0, 0, 0, 0];

      let attempts = 0;
      let check;
      do {
        const a = Math.floor(Math.random() * 10);
        const b = Math.floor(Math.random() * 10);
        const c = Math.floor(Math.random() * 10);
        const d = Math.floor(Math.random() * 10);
        check = [a, b, c, d];
        attempts++;
      } while (
        indexArray && 
        indexArray[0] === check[0] &&
        indexArray[1] === check[1] &&
        indexArray[2] === check[2] &&
        indexArray[3] === check[3] &&
        attempts < 10
      );

      return check;
    }

    function generateCuteNote(categoryKey, check) {
      const cat = CATEGORIES_DATA[categoryKey];
      const [a, b, c, d] = check;
      return `${cat.A[a]} ${cat.B[b]} ${cat.C[c]} ${cat.D[d]}`;
    }

    function findTagIndex(check) {
      const [a, b, c, d] = check;
      return (a * 1000) + (b * 100) + (c * 10) + d + 1;
    }

    function triggerModal(categoryKey) {
      targetKey = categoryKey;
      const cat = CATEGORIES_DATA[categoryKey];
      if (!cat) return;

      indexArray = createCombination(categoryKey);
      const numericalNo = findTagIndex(indexArray);

      dom.circleIcon.textContent = cat.icon;
      dom.circleIcon.style.background = cat.bg_color;
      dom.circleIcon.style.color = cat.text_color;
      dom.headerCategory.textContent = cat.title;
      dom.combIndex.textContent = `Note #${numericalNo.toLocaleString()} / 10,000`;
      dom.modalText.textContent = generateCuteNote(categoryKey, indexArray);

      // FIX BUG: Prevent text from being stuck invisible if timer was running
      if (shuffleTimer) clearTimeout(shuffleTimer);
      dom.modalText.classList.remove('fading');
      // Guarantee opacity override just in case
      dom.modalText.style.opacity = '1';
      dom.modalText.style.transform = 'translateY(0)';

      // Reset unroll animation
      dom.paperView.style.animation = 'none';
      dom.paperView.offsetHeight; 
      dom.paperView.style.animation = null;

      dom.overlayCard.classList.add('visible');
      synth.chimeUnroll(); 
    }

    function triggerShuffle() {
      if (!targetKey) return;
      synth.chimeShuffle();

      // Clear any pending shuffles to prevent stacking issues
      if (shuffleTimer) clearTimeout(shuffleTimer);

      dom.modalText.style.opacity = ''; // Remove inline override
      dom.modalText.style.transform = '';
      dom.modalText.classList.add('fading');

      // Original calm delay restored
      shuffleTimer = setTimeout(() => {
        indexArray = createCombination(targetKey);
        const numericalNo = findTagIndex(indexArray);

        dom.combIndex.textContent = `Note #${numericalNo.toLocaleString()} / 10,000`;
        dom.modalText.textContent = generateCuteNote(targetKey, indexArray);
        dom.modalText.classList.remove('fading');
      }, 160);
    }

    function dismissModal() {
      if (!dom.overlayCard.classList.contains('visible')) return;
      synth.chimeClose();
      dom.overlayCard.classList.remove('visible');
      // Fix bug: Ensure next open isn't invisible
      if (shuffleTimer) clearTimeout(shuffleTimer);
      dom.modalText.classList.remove('fading');
    }

    document.querySelectorAll('.bottle-embedded-tag').forEach(badge => {
      badge.addEventListener('click', () => {
        synth.startAmbient();
        
        const catKey = badge.getAttribute('data-category');
        badge.classList.add('tugging');
        synth.chimeTap();

        // Restored beautiful slow 300ms delay before pop-up
        setTimeout(() => {
          badge.classList.remove('tugging');
          triggerModal(catKey);
        }, 300);
      });
    });

    dom.btnAbort.addEventListener('click', dismissModal);
    dom.btnCloseTop.addEventListener('click', dismissModal);
    dom.btnShuffle.addEventListener('click', triggerShuffle);

    dom.overlayCard.addEventListener('click', (e) => {
      if (e.target === dom.overlayCard) dismissModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') dismissModal();
    });

    dom.audioSwitch.addEventListener('click', () => {
      const isPlayable = synth.toggle();
      dom.audioGlyph.textContent = isPlayable ? '🔔' : '🔕';
      dom.audioStatus.textContent = isPlayable ? 'Sound On' : 'Sound Muted';
    });
  </script>
